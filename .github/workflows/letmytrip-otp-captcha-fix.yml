name: LETMYTRIP OTP Backend Fallback

on:
  push:
    branches:
      - letmytrip-otp-secure-20261007

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add backend OTP fallback
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          p=Path("letmytrip-site/index.html")
          s=p.read_text(encoding="utf-8")
          marker="<!-- LETMYTRIP-BACKEND-OTP -->"
          if marker not in s:
              code=base64.b64decode("").decode("utf-8")
              s=s.replace("</body>", marker+code+"</body>", 1)
              p.write_text(s, encoding="utf-8")
          PY
          git config user.name "LETMYTRIP OTP Bot"
          git config user.email "actions@github.com"
          git add letmytrip-site/index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Use backend MSG91 OTP flow in LETMYTRIP"; git push; fi
