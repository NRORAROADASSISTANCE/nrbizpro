name: LETMYTRIP OTP Captcha Cleanup

on:
  push:
    branches:
      - letmytrip-otp-secure-20261007

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete MSG91 captcha configuration
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("letmytrip-site/index.html")
          s = p.read_text(encoding="utf-8")
          s2 = s
          s2 = s2.replace('<div id="msg91-captcha" style="margin-top:10px"></div>', '')
          s2 = s2.replace("captchaRenderId:'msg91-captcha',", '')
          s2 = s2.replace("captchaRenderId:'',", '')
          if s2 != s:
              p.write_text(s2, encoding="utf-8")
          PY
          git config user.name "LETMYTRIP OTP Bot"
          git config user.email "actions@github.com"
          git add letmytrip-site/index.html
          if git diff --cached --quiet; then
            echo "No captcha cleanup changes needed."
          else
            git commit -m "Remove obsolete MSG91 captcha from LETMYTRIP"
            git push
          fi
