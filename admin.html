<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR BizPro — Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div id="login" class="center"><div class="card login"><div class="brand"><span>NR</span><div><b>NR BizPro</b><small>Admin Panel</small></div></div><h1>Admin Login</h1><p>Manage your NR BizPro platform.</p><form onsubmit="login(event)"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><div id="error"></div></div></div>
<div id="panel" class="hidden"><header><div class="brand"><span>NR</span><div><b>NR BizPro</b><small>Admin Panel</small></div></div><button class="logout" onclick="logout()">Logout</button></header><main><div class="heading"><div><p>ADMINISTRATION</p><h1>Platform Overview</h1></div></div><section class="stats"><div><small>Total Businesses</small><strong id="total">0</strong></div><div><small>Active</small><strong id="active">0</strong></div><div><small>Pending</small><strong id="pending">0</strong></div><div><small>Expired</small><strong id="expired">0</strong></div></section><section class="card"><div class="tablehead"><h2>Business Accounts</h2><input id="search" placeholder="Search business / email / mobile" oninput="render()"></div><div class="tablewrap"><table><thead><tr><th>Business</th><th>Owner</th><th>Contact</th><th>Category</th><th>Status</th><th>Plan</th><th>Expiry</th></tr></thead><tbody id="users"></tbody></table></div></section></main></div>
<script src="admin.js"></script></body></html>
