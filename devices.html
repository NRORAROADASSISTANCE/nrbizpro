<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR BizPro — Authorized Devices</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell" style="max-width:900px;margin:40px auto"><section class="panel"><div class="panel-head"><div><h1>Authorized Devices</h1><p class="muted">Maximum 3 devices per business. Remove a device to allow another device.</p></div><a class="secondary" href="/">Back to NR BizPro</a></div><div id="deviceMessage" class="notice hidden"></div><div class="table-wrap"><table><thead><tr><th>Device</th><th>Type</th><th>Added</th><th>Last Active</th><th>Status</th><th></th></tr></thead><tbody id="deviceRows"></tbody></table></div></section></main><script>
(async()=>{const msg=document.getElementById('deviceMessage');function show(t){msg.textContent=t;msg.classList.remove('hidden')}async function load(){const r=await fetch('/api/device?action=list',{credentials:'include'});const d=await r.json();if(!r.ok){show(d.error||'Please login first.');return}document.getElementById('deviceRows').innerHTML=d.devices.map(x=>`<tr><td>${esc(x.device_name)}</td><td>${esc(x.device_type)}</td><td>${fmt(x.created_at)}</td><td>${fmt(x.last_seen_at)}</td><td>${x.active?'Active':'Removed'}</td><td>${x.active?`<button onclick="removeDevice('${x.id}')">Remove</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">No authorized devices yet.</td></tr>'}window.removeDevice=async id=>{if(!confirm('Remove this device? It will no longer be allowed to login.'))return;const r=await fetch('/api/device',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({action:'remove',deviceId:id})});const d=await r.json();if(!r.ok)return show(d.error||'Unable to remove device.');await load()};function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]) )}function fmt(v){return v?new Date(v).toLocaleString():'-'}load()})();
</script></body></html>
