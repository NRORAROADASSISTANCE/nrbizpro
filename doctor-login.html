<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Doctor Login</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f8fc;color:#10233f}.box{width:min(470px,92%);margin:70px auto;background:#fff;border:1px solid #dfe7f2;border-radius:18px;padding:28px;box-shadow:0 10px 35px rgba(20,50,90,.08)}h1{margin:0 0 6px}.muted{color:#718198}.field{display:block;margin:14px 0;font-weight:700;font-size:13px}.field input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cbd8e8;border-radius:9px}.btn{width:100%;border:0;background:#1264f5;color:#fff;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.notice{margin:12px 0;padding:11px;background:#eef5ff;color:#1559d6;border-radius:9px}</style></head><body>
<div class="box"><div style="font-weight:900;color:#1264f5;font-size:22px">NR HMS</div><h1>Doctor Login</h1><p class="muted">Login and search a patient using the Hospital OPD Number.</p>
<div id="msg"></div><label class="field">Hospital ID<input id="hospitalId" placeholder="Hospital ID"></label><label class="field">Doctor Login ID<input id="doctorId"></label><label class="field">Password<input id="password" type="password"></label><button class="btn" onclick="login()">Doctor Login</button></div>
<script>async function login(){msg.innerHTML='';try{const r=await fetch('/api/auth?action=hms-doctor-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hospitalId:hospitalId.value.trim(),doctorId:doctorId.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error);sessionStorage.setItem('nrDoctor',JSON.stringify(d.doctor));location.href='/doctor-patient.html'}catch(e){msg.innerHTML='<div class="notice">'+e.message+'</div>'}}</script></body></html>
