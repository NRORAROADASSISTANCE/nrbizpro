<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Doctor Patient Profile</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f8fc;color:#10233f}.top{background:#0b2342;color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:25px}.search{background:#fff;padding:18px;border-radius:15px;border:1px solid #e1e8f2;display:flex;gap:10px}.search input{flex:1;padding:12px;border:1px solid #ccd8e7;border-radius:9px}.btn{background:#1264f5;color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:15px;padding:20px}.full{grid-column:1/-1}.muted{color:#718198}.notice{padding:12px;background:#fff1f1;color:#a32222;border-radius:9px;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.search{flex-direction:column}}</style></head><body>
<header class="top"><b>NR HMS — Doctor Portal</b><span id="doctorName"></span></header><main class="wrap">
<div class="search"><input id="opd" placeholder="Enter Patient OPD Number e.g. OPD-123456"><button class="btn" onclick="searchPatient()">View Patient Profile</button><button class="btn" onclick="logout()">Logout</button></div><div id="msg"></div><section id="result"></section></main>
<script>
const doctor=JSON.parse(sessionStorage.getItem('nrDoctor')||'null');if(!doctor)location.href='/doctor-login.html';else doctorName.textContent=doctor.name+' • '+doctor.specialization;
const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function searchPatient(){msg.innerHTML='';result.innerHTML='';try{const r=await fetch('/api/auth?action=hms-doctor-patient&opd='+encodeURIComponent(opd.value.trim()),{cache:'no-store',credentials:'include'});const d=await r.json();if(!r.ok)throw Error(d.error);const p=d.patient;result.innerHTML='<div class="grid"><div class="card"><h2>Patient Profile</h2><p><b>OPD Number:</b> '+esc(p.opdNumber)+'</p><p><b>Name:</b> '+esc(p.name)+'</p><p><b>Mobile:</b> '+esc(p.mobile)+'</p><p><b>Age:</b> '+esc(p.age)+'</p><p><b>Gender:</b> '+esc(p.gender)+'</p><p><b>Blood Group:</b> '+esc(p.bloodGroup||'—')+'</p><p><b>Address:</b> '+esc(p.address||'—')+'</p></div><div class="card"><h2>Appointments</h2>'+(d.appointments.length?d.appointments.map(x=>'<p><b>'+esc(x.date)+'</b> — '+esc(x.doctor)+' — '+esc(x.status)+'</p>').join(''):'<p class="muted">No appointments found.</p>')+'</div><div class="card"><h2>Billing</h2>'+(d.bills.length?d.bills.map(x=>'<p><b>'+esc(x.invoice)+'</b> — '+esc(x.service)+' — ₹'+esc(x.amount)+'</p>').join(''):'<p class="muted">No billing records found.</p>')+'</div><div class="card full"><h2>Clinical / Medical Record</h2><p><b>Symptoms:</b> '+esc(p.symptoms||'Not recorded')+'</p><p><b>Diagnosis:</b> '+esc(p.diagnosis||'Not recorded')+'</p><p><b>Medicines:</b> '+esc(p.medicines||'Not recorded')+'</p><p class="muted">More clinical modules such as prescriptions, lab reports and medical history can be added here.</p></div></div>'}catch(e){msg.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function logout(){await fetch('/api/auth?action=hms-doctor-logout',{method:'POST',credentials:'include'}).catch(()=>{});sessionStorage.removeItem('nrDoctor');location.href='/doctor-login.html'}
</script></body></html>
