<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Company Owner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#18324a;background:#e8eef2;overflow:hidden}
 .office{position:fixed;inset:0;overflow:hidden;background-image:linear-gradient(rgba(235,248,252,.05),rgba(235,248,252,.05)),url("https://d3e6tmgg461bic.cloudfront.net/Pictures/2000xAny/7/6/1/3069761_virtualwardhospitaldigital_333234_crop.jpg");background-size:cover;background-position:center;background-repeat:no-repeat}.office:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,0) 45%,rgba(255,255,255,.08));backdrop-filter:blur(1.5px)}
.office:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,54,78,.05),rgba(10,54,78,.16));pointer-events:none}
.wrap{position:relative;z-index:5;max-width:520px;margin:0 auto;padding:38px 18px}
.logo{text-align:center;margin-bottom:18px}.logoMark{width:58px;height:58px;margin:auto;border:1px solid #b88728;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff,#f1f4f5);box-shadow:0 7px 20px rgba(20,45,62,.28);font-size:19px;font-weight:900;color:#a47216;letter-spacing:2px}
.hms{margin-top:8px;font-size:25px;font-weight:900;letter-spacing:5px;color:#173653;text-shadow:0 2px 5px #fff}.tag{margin-top:4px;color:#526b7e;font-size:9px;letter-spacing:2px;text-transform:uppercase}
.card{background:rgba(255,255,255,.96);border:1px solid #d2dce3;border-radius:18px;padding:27px;box-shadow:0 20px 45px rgba(30,49,62,.28)}
.title{font-size:20px;font-weight:800;margin-bottom:5px;color:#173653}.sub{color:#718394;margin-bottom:19px;font-size:12px}
.field{display:block;font-size:11px;font-weight:800;color:#405a70;margin:13px 0}.field input{display:block;width:100%;margin-top:7px;padding:12px 13px;background:#f7fafc;color:#18324a;border:1px solid #c9d5de;border-radius:9px;font-size:14px;outline:none}.field input:focus{border-color:#b88728;box-shadow:0 0 0 3px rgba(184,135,40,.12)}
.primary{width:100%;margin-top:9px;padding:13px;border:1px solid #b88728;border-radius:9px;background:linear-gradient(135deg,#e4c56e,#b7892b);color:#18202a;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 7px 16px rgba(120,91,30,.2)}.primary:disabled{opacity:.7}
.notice{margin-top:13px;padding:10px;border-radius:9px;background:#fff1f1;color:#b42318;border:1px solid #efb4b4}.hint{margin-top:14px;font-size:10px;color:#81909d;text-align:center}
</style>
<style>
.portal{display:none;position:relative;z-index:6;max-width:1180px;margin:0 auto;padding:24px 18px;height:100vh;overflow:auto}
.portalHead{background:rgba(255,255,255,.96);border:1px solid #d2dce3;border-radius:16px;padding:18px 20px;box-shadow:0 12px 30px rgba(30,49,62,.2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.portalTitle{font-size:21px;font-weight:900;color:#173653}.portalSub{font-size:11px;color:#718394;margin-top:4px}
.logout{border:1px solid #c9d5de;background:#fff;padding:9px 14px;border-radius:8px;font-weight:800;cursor:pointer;color:#405a70}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:rgba(255,255,255,.96);border:1px solid #d2dce3;border-radius:13px;padding:15px;box-shadow:0 8px 22px rgba(30,49,62,.14)}.stat b{display:block;font-size:23px;color:#173653}.stat span{font-size:10px;color:#718394}
.tableCard{background:rgba(255,255,255,.97);border:1px solid #d2dce3;border-radius:15px;padding:16px;box-shadow:0 12px 28px rgba(30,49,62,.18);overflow:auto}
.tableTitle{font-weight:900;color:#173653;margin-bottom:10px}.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid #e5ebef;text-align:left;white-space:nowrap}.tbl th{color:#526b7e;background:#f7fafc}.pill{display:inline-block;padding:4px 7px;border-radius:99px;font-size:9px;font-weight:800}.approved{background:#e6f7ed;color:#16803c}.pending{background:#fff5d8;color:#9a6b00}.rejected{background:#ffe9e9;color:#b42318}.paid{background:#e6f7ed;color:#16803c}.action{border:0;border-radius:6px;padding:6px 8px;font-size:10px;font-weight:800;cursor:pointer;margin-right:4px}.approve{background:#e7f3ff;color:#1261a0}.pay{background:#e7f7ed;color:#16803c}.reject{background:#ffe9e9;color:#b42318}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.portalHead{align-items:flex-start}.portalTitle{font-size:18px}}
</style></head><body><div class="office"></div><main class="wrap" id="loginWrap"><div class="logo"><div class="logoMark">HMS</div><div class="hms">NR HMS</div><div class="tag">Healthcare Management System</div></div><section class="card"><div class="title">Company Owner Portal</div><div class="sub">Secure hospital verification & management access</div><label class="field">Company Owner Email<input id="e" type="email" placeholder="admin@nrbizpro.in" autocomplete="username" spellcheck="false"></label><label class="field">Company Owner Password<input id="p" type="password" placeholder="Enter owner password" autocomplete="current-password"></label><button class="primary" id="b">Login as Company Owner</button><div id="m"></div><div class="hint">This is the permanent Company Owner login — not a hospital/demo login.</div></section></main><script>const $=id=>document.getElementById(id);$('b').onclick=async()=>{const email=$('e').value.trim(),password=$('p').value;if(!email||!password){$('m').innerHTML='<div class="notice">Enter Company Owner email and password.</div>';return}$('b').disabled=true;$('b').textContent='Signing in...';try{const r=await fetch('/api/auth?action=hms-owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({email,password})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||'Company Owner login failed.');$('m').innerHTML='<div style="color:#16803c;margin-top:12px;font-weight:700">Login successful. Opening owner portal...</div>';await loadPortal()}catch(e){$('m').innerHTML='<div class="notice">'+String(e.message).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</div>'}finally{$('b').disabled=false;$('b').textContent='Login as Company Owner'}}</script></body></html>
