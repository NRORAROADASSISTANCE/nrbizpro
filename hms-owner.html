.primary{width:100%;margin-top:9px;padding:13px;border:1px solid #b88728;border-radius:9px;background:linear-gradient(135deg,#e4c56e,#b7892b);color:#18202a;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 7px 16px rgba(120,91,30,.2)}.primary:disabled{opacity:.7}

</style></head><body><div class="office"></div><main class="wrap"><div class="logo"><div class="logoMark">HMS</div><div class="hms">NR HMS</div><div class="tag">Healthcare Management System</div></div><section class="card"><div class="title">Company Owner Portal</div><div class="sub">Secure hospital verification & management access</div><label class="field">Company Owner Email<input id="e" type="email" placeholder="admin@nrbizpro.in" autocomplete="username" spellcheck="false"></label><label class="field">Company Owner Password<input id="p" type="password" placeholder="Enter owner password" autocomplete="current-password"></label><button class="primary" id="b">Login as Company Owner</button><div id="m"></div><div class="hint">This is the permanent Company Owner login — not a hospital/demo login.</div></section></main><script>const $=id=>document.getElementById(id);$('b').onclick=async()=>{const email=$('e').value.trim(),password=$('p').value;if(!email||!password){$('m').innerHTML='<div class="notice">Enter Company Owner email and password.</div>';return}$('b').disabled=true;$('b').textContent='Signing in...';try{const r=await fetch('/api/auth?action=hms-owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({email,password})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||'Company Owner login failed.');$('m').innerHTML='<div style="color:#16803c;margin-top:12px;font-weight:700">Login successful. Opening owner portal...</div>';location.href='/hms-owner.html?panel=1'}catch(e){$('m').innerHTML='<div class="notice">'+String(e.message).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</div>'}finally{$('b').disabled=false;$('b').textContent='Login as Company Owner'}}</script></body></html>
