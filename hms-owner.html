<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Company Owner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#17324d;background:#dfe7ed;overflow:hidden}
.office{position:fixed;inset:0;background:linear-gradient(180deg,#d8e3eb 0%,#edf2f5 54%,#b9c5ce 55%,#8997a1 100%);overflow:hidden}
.office:before{content:"";position:absolute;left:5%;right:5%;top:8%;height:47%;border:12px solid #263b4d;border-bottom:0;background:linear-gradient(90deg,#b9d2df 0 31%,#e9f2f6 31% 34%,#9fc1d0 34% 66%,#e8f1f4 66% 69%,#a8c6d4 69%);box-shadow:inset 0 -25px 45px #49687a44}
.office:after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,#a9b2b8,#737e86);clip-path:polygon(0 18%,100% 0,100% 100%,0 100%);box-shadow:inset 0 35px 50px #ffffff22}
.wrap{position:relative;z-index:5;max-width:540px;margin:0 auto;padding:42px 20px}
.logo{text-align:center;margin-bottom:16px}.logoMark{width:62px;height:62px;margin:auto;border:1px solid #b58a2a;border-radius:17px;display:flex;align-items:center;justify-content:center;background:#ffffffee;box-shadow:0 8px 22px #152b3c55;font-size:21px;font-weight:900;color:#a27416;letter-spacing:2px}
.hms{margin-top:8px;font-size:26px;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 2px 7px #13283a}.tag{margin-top:4px;color:#edf4f8;font-size:10px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 5px #17324d}
.card{background:#ffffffee;border:1px solid #d2dce4;border-radius:20px;padding:28px;box-shadow:0 24px 65px #152b3c66;backdrop-filter:blur(8px)}
.title{font-size:21px;font-weight:800;margin-bottom:5px;color:#173452}.sub{color:#667b8d;margin-bottom:20px;font-size:12px}
.field{display:block;font-size:12px;font-weight:800;color:#415a72;margin:14px 0}.field input{display:block;width:100%;margin-top:7px;padding:13px 14px;background:#f8fbfd;color:#18324b;border:1px solid #c7d5df;border-radius:9px;font-size:14px;outline:none}.field input:focus{border-color:#b58a2a;box-shadow:0 0 0 3px #b58a2a18}
.primary{width:100%;margin-top:10px;padding:13px;border:1px solid #b58a2a;border-radius:9px;background:linear-gradient(135deg,#e2c16b,#b88b2b);color:#17202a;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 8px 18px #6d542033}.primary:disabled{opacity:.7}
.notice{margin-top:13px;padding:10px;border-radius:9px;background:#fff1f1;color:#b42318;border:1px solid #efb4b4}.hint{margin-top:15px;font-size:10px;color:#7d8fa1;text-align:center}
</style></head><body><div class="office"></div><main class="wrap"><div class="logo"><div class="logoMark">HMS</div><div class="hms">NR HMS</div><div class="tag">Healthcare Management System</div></div><section class="card"><div class="title">Company Owner Portal</div><div class="sub">Secure hospital verification & management access</div><label class="field">Company Owner Email<input id="e" type="email" placeholder="admin@nrbizpro.in" autocomplete="username" spellcheck="false"></label><label class="field">Company Owner Password<input id="p" type="password" placeholder="Enter owner password" autocomplete="current-password"></label><button class="primary" id="b">Login as Company Owner</button><div id="m"></div><div class="hint">This is the permanent Company Owner login — not a hospital/demo login.</div></section></main><script>const $=id=>document.getElementById(id);$('b').onclick=async()=>{const email=$('e').value.trim(),password=$('p').value;if(!email||!password){$('m').innerHTML='<div class="notice">Enter Company Owner email and password.</div>';return}$('b').disabled=true;$('b').textContent='Signing in...';try{const r=await fetch('/api/auth?action=hms-owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({email,password})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||'Company Owner login failed.');$('m').innerHTML='<div style="color:#16803c;margin-top:12px;font-weight:700">Login successful. Opening owner portal...</div>';location.href='/hms-owner.html?panel=1'}catch(e){$('m').innerHTML='<div class="notice">'+String(e.message).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</div>'}finally{$('b').disabled=false;$('b').textContent='Login as Company Owner'}}</script></body></html>
