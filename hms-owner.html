<!doctype html><html><head><meta charset="utf-8"><title>NR HMS Owner</title></head><body><h1>NR HMS Company Owner</h1><p>Company verification portal</p><label>Email <input id="e"></label><label>Password <input id="p" type="password"></label><button id="b">Login</button><div id="m"></div><script>document.getElementById('b').onclick=async()=>{const r=await fetch('/api/auth?action=hms-owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:e.value,password:p.value})});const d=await r.json();m.textContent=d.error||'Logged in';if(r.ok)location.href='/hms-owner.html?panel=1'}</script></body></html>
