<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Company Owner</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;font-family:Arial,sans-serif;color:#12233d}.wrap{max-width:480px;margin:70px auto;padding:20px}.card{background:#fff;border:1px solid #dce6f2;border-radius:18px;padding:30px;box-shadow:0 12px 35px #16365a12}.brand{font-size:26px;font-weight:800;margin-bottom:6px}.sub{color:#60728a;margin-bottom:24px}.field{display:block;font-size:13px;font-weight:700;margin:14px 0}.field input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #cbd7e6;border-radius:10px;font-size:15px}.primary{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#1264f5;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.notice{margin-top:14px;padding:11px;border-radius:9px;background:#fff3f3;color:#b42318}.hint{margin-top:16px;font-size:12px;color:#718096;text-align:center}</style></head><body><main class="wrap"><section class="card"><div class="brand">NR HMS Company Owner</div><div class="sub">Company verification & hospital approval portal</div><label class="field">Company Owner Email<input id="e" type="email" placeholder="admin@nrbizpro.in" autocomplete="username" spellcheck="false"></label><label class="field">Company Owner Password<input id="p" type="password" placeholder="Enter owner password" autocomplete="current-password"></label><button class="primary" id="b">Login as Company Owner</button><div id="m"></div><div class="hint">This is the permanent Company Owner login — not a hospital/demo login.</div></section></main><script>const $=id=>document.getElementById(id);$('b').onclick=async()=>{const email=$('e').value.trim(),password=$('p').value;if(!email||!password){$('m').innerHTML='<div class="notice">Enter Company Owner email and password.</div>';return}$('b').disabled=true;$('b').textContent='Signing in...';try{const r=await fetch('/api/auth?action=hms-owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({email,password})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||'Company Owner login failed.');$('m').innerHTML='<div style="color:#16803c;margin-top:12px;font-weight:700">Login successful. Opening owner portal...</div>';location.href='/hms-owner.html?panel=1'}catch(e){$('m').innerHTML='<div class="notice">'+String(e.message).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</div>'}finally{$('b').disabled=false;$('b').textContent='Login as Company Owner'}}</script></body></html>
