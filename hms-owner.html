<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Company Owner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 20%,#173d68 0,#0a1c35 34%,#040b17 72%,#02050b 100%);font-family:Arial,sans-serif;color:#fff;overflow:hidden}
body:before,body:after{content:"";position:fixed;border:1px solid #d7b76a22;border-radius:50%;pointer-events:none}
body:before{width:520px;height:520px;right:-180px;top:-180px;box-shadow:0 0 100px #0bb9c522}
body:after{width:380px;height:380px;left:-190px;bottom:-180px}
.bg{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.8%,#ffffff06 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,#ffffff06 50%,transparent 50.2%);background-size:90px 90px;opacity:.25}
.wrap{position:relative;z-index:2;max-width:540px;margin:0 auto;padding:70px 20px}
.logo{text-align:center;margin-bottom:25px}.logoMark{width:78px;height:78px;margin:auto;border:1px solid #d7b76a99;border-radius:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#12385d,#071425);box-shadow:0 12px 40px #0008,inset 0 1px #fff2;font-size:25px;font-weight:900;color:#f3d27a;letter-spacing:2px}
.hms{margin-top:13px;font-size:28px;font-weight:900;letter-spacing:5px;color:#fff}.tag{margin-top:6px;color:#aebed2;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.card{background:linear-gradient(145deg,#ffffff12,#ffffff07);border:1px solid #d7b76a55;border-radius:24px;padding:32px;box-shadow:0 25px 70px #0009,inset 0 1px #ffffff18;backdrop-filter:blur(18px)}
.title{font-size:22px;font-weight:800;margin-bottom:6px}.sub{color:#b9c8d9;margin-bottom:24px;font-size:13px}
.field{display:block;font-size:12px;font-weight:800;color:#d7e0ea;margin:15px 0}.field input{display:block;width:100%;margin-top:8px;padding:14px 15px;background:#061426cc;color:#fff;border:1px solid #91a5bd44;border-radius:11px;font-size:15px;outline:none}.field input:focus{border-color:#d7b76a99;box-shadow:0 0 0 3px #d7b76a12}
.primary{width:100%;margin-top:12px;padding:14px;border:1px solid #f1d47c88;border-radius:11px;background:linear-gradient(135deg,#d9b75f,#9f7424);color:#101010;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 10px 25px #0005}.primary:disabled{opacity:.7}
.notice{margin-top:15px;padding:11px;border-radius:10px;background:#6b182222;color:#ffd2d2;border:1px solid #ff8b8b33}.hint{margin-top:18px;font-size:11px;color:#8497ad;text-align:center}
</style></head><body><div class="bg"></div><main class="wrap"><div class="logo"><div class="logoMark">HMS</div><div class="hms">NR HMS</div><div class="tag">Healthcare Management System</div></div><section class="card"><div class="title">Company Owner Portal</div><div class="sub">Secure hospital verification & management access</div><label class="field">Company Owner Email<input id="e" type="email" placeholder="admin@nrbizpro.in" autocomplete="username" spellcheck="false"></label><label class="field">Company Owner Password<input id="p" type="password" placeholder="Enter owner password" autocomplete="current-password"></label><button class="primary" id="b">Login as Company Owner</button><div id="m"></div><div class="hint">This is the permanent Company Owner login — not a hospital/demo login.</div></section></main><script>const $=id=>document.getElementById(id);$('b').onclick=async()=>{const email=$('e').value.trim(),password=$('p').value;if(!email||!password){$('m').innerHTML='<div class="notice">Enter Company Owner email and password.</div>';return}$('b').disabled=true;$('b').textContent='Signing in...';try{const r=await fetch('/api/auth?action=hms-owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({email,password})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||'Company Owner login failed.');$('m').innerHTML='<div style="color:#16803c;margin-top:12px;font-weight:700">Login successful. Opening owner portal...</div>';location.href='/hms-owner.html?panel=1'}catch(e){$('m').innerHTML='<div class="notice">'+String(e.message).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</div>'}finally{$('b').disabled=false;$('b').textContent='Login as Company Owner'}}</script></body></html>
