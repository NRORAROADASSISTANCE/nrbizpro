<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Company Owner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef5fb 0%,#dfeaf4 48%,#f7fafc 100%);font-family:Arial,sans-serif;color:#19324d;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,#ffffffaa 1px,transparent 1px),linear-gradient(#ffffffaa 1px,transparent 1px);background-size:70px 70px;opacity:.28;pointer-events:none}
.office{position:fixed;inset:0;pointer-events:none;overflow:hidden}.office:before{content:"";position:absolute;width:520px;height:230px;right:-80px;top:70px;background:linear-gradient(135deg,#c9d8e7,#f5f9fc);border-radius:24px;transform:rotate(-8deg);box-shadow:0 25px 70px #607d9922}.office:after{content:"";position:absolute;width:360px;height:360px;left:-150px;bottom:-190px;border-radius:50%;background:#b9cddd55}
.wrap{position:relative;z-index:2;max-width:540px;margin:0 auto;padding:55px 20px}
.logo{text-align:center;margin-bottom:22px}.logoMark{width:72px;height:72px;margin:auto;border:1px solid #b58a2a;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffffff,#e8f0f7);box-shadow:0 12px 30px #31506b22,inset 0 1px #fff;font-size:23px;font-weight:900;color:#a27416;letter-spacing:2px}
.hms{margin-top:11px;font-size:27px;font-weight:900;letter-spacing:5px;color:#173452}.tag{margin-top:5px;color:#71859a;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.card{background:#ffffffdf;border:1px solid #c6d4e2;border-radius:22px;padding:30px;box-shadow:0 22px 55px #29445e22,inset 0 1px #fff;backdrop-filter:blur(12px)}
.title{font-size:22px;font-weight:800;margin-bottom:6px;color:#173452}.sub{color:#6a7d91;margin-bottom:23px;font-size:13px}
.field{display:block;font-size:12px;font-weight:800;color:#415a72;margin:15px 0}.field input{display:block;width:100%;margin-top:8px;padding:14px 15px;background:#f8fbfe;color:#18324b;border:1px solid #c7d5e2;border-radius:10px;font-size:15px;outline:none}.field input:focus{border-color:#b58a2a;box-shadow:0 0 0 3px #b58a2a18}
.primary{width:100%;margin-top:12px;padding:14px;border:1px solid #b58a2a;border-radius:10px;background:linear-gradient(135deg,#e2c16b,#b88b2b);color:#17202a;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 9px 22px #6d542020}.primary:disabled{opacity:.7}
.notice{margin-top:15px;padding:11px;border-radius:10px;background:#fff1f1;color:#b42318;border:1px solid #efb4b4}.hint{margin-top:17px;font-size:11px;color:#7d8fa1;text-align:center}
</style></head><body><div class="office"></div><main class="wrap"><div class="logo"><div class="logoMark">HMS</div><div class="hms">NR HMS</div><div class="tag">Healthcare Management System</div></div><section class="card"><div class="title">Company Owner Portal</div><div class="sub">Secure hospital verification & management access</div><label class="field">Company Owner Email<input id="e" type="email" placeholder="admin@nrbizpro.in" autocomplete="username" spellcheck="false"></label><label class="field">Company Owner Password<input id="p" type="password" placeholder="Enter owner password" autocomplete="current-password"></label><button class="primary" id="b">Login as Company Owner</button><div id="m"></div><div class="hint">This is the permanent Company Owner login — not a hospital/demo login.</div></section></main><script>const $=id=>document.getElementById(id);$('b').onclick=async()=>{const email=$('e').value.trim(),password=$('p').value;if(!email||!password){$('m').innerHTML='<div class="notice">Enter Company Owner email and password.</div>';return}$('b').disabled=true;$('b').textContent='Signing in...';try{const r=await fetch('/api/auth?action=hms-owner-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({email,password})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||'Company Owner login failed.');$('m').innerHTML='<div style="color:#16803c;margin-top:12px;font-weight:700">Login successful. Opening owner portal...</div>';location.href='/hms-owner.html?panel=1'}catch(e){$('m').innerHTML='<div class="notice">'+String(e.message).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</div>'}finally{$('b').disabled=false;$('b').textContent='Login as Company Owner'}}</script></body></html>
