<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR HMS — Staff Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#153650;font-family:Inter,Arial,sans-serif}.top{background:#0b4f86;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #dce9f1;border-radius:16px;padding:22px;box-shadow:0 10px 28px #1d4f6f10}.card h2,.card h3{margin-top:0}.muted{color:#718495;line-height:1.7}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.blue{background:#1769aa;color:#fff}.light{background:#fff;color:#1769aa;border:1px solid #c9dce9}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.top{padding:13px 16px}}</style></head><body><header class="top"><b>NR HMS — Staff Dashboard</b><button class="btn light" onclick="logout()">Logout</button></header><main class="wrap"><div class="card"><h1 id="welcome">Welcome</h1><p id="info" class="muted">Loading your office profile...</p></div><div class="grid" style="margin-top:18px"><div class="card"><h3>Patient Desk</h3><p class="muted">Access the hospital patient workflow according to your assigned department permissions.</p><button class="btn blue" onclick="openHms()">Open HMS</button></div><div class="card"><h3>Appointments</h3><p class="muted">Hospital appointment operations can be handled through the assigned HMS workspace.</p><button class="btn light" onclick="openHms()">Open Appointments</button></div><div class="card"><h3>Department</h3><p id="dept" class="muted">—</p></div></div></main><script>async function api(a,o={}){const r=await fetch('/api/auth?action='+a,{...o,credentials:'include',headers:{'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api('hms-account-me');document.getElementById('welcome').textContent='Welcome, '+d.user.name;document.getElementById('info').textContent=d.user.hospital+' • Login ID: '+d.user.loginId;document.getElementById('dept').textContent=d.user.department||'Staff'}catch(e){location.href='/hospital-demo.html'}}function openHms(){location.href='/hms.html'}async function logout(){await api('hms-account-logout',{method:'POST'});location.href='/hospital-demo.html'}load();</script></body></html>
