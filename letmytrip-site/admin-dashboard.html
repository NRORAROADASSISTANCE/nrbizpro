<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LETMYTRIP | Admin Dashboard</title><style>body{font-family:Inter,Arial;margin:0;background:#f7f4ed;color:#12233d}header{background:#071b3a;color:#fff;padding:17px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900}.brand span{color:#c8943d}button{padding:9px 13px;border:0;border-radius:8px;cursor:pointer;font-weight:800}.logout{background:#fff;color:#071b3a}main{max-width:1250px;margin:25px auto;padding:0 18px}.box{background:#fff;padding:20px;border:1px solid #e7dfd0;border-radius:14px;margin-bottom:18px;box-shadow:0 8px 28px rgba(7,27,58,.06)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;background:#faf7f0;border-radius:10px}.stat b{display:block;font-size:25px;margin-top:5px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid #eee8dc;text-align:left;font-size:13px}.PENDING{color:#a15c00}.APPROVED{color:#16834d}.REJECTED{color:#b42318}.green{background:#16834d;color:#fff}.red{background:#b42318;color:#fff}.msg{font-weight:800}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><div class="brand">LET<span>MY</span>TRIP — Admin</div><button class="logout" id="logout">Logout</button></header><main><div class="box"><h1>Agent Applications</h1><p id="msg" class="msg"></p><div class="stats"><div class="stat">Total<b id="total">0</b></div><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Approved<b id="approved">0</b></div><div class="stat">Rejected<b id="rejected">0</b></div></div></div><div class="box"><button onclick="load()">↻ Refresh</button><div class="table"><table><thead><tr><th>Application</th><th>Agency / Owner</th><th>Contact</th><th>KYC</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function load(){try{let s=await fetch("/api/admin-session");if(!s.ok)throw Error();let r=await fetch("/api/admin-agent-applications",{credentials:"same-origin"}),d=await r.json();if(!r.ok)throw Error(d.error);let a=d.applications||[],c={PENDING:0,APPROVED:0,REJECTED:0};a.forEach(x=>c[x.status]=(c[x.status]||0)+1);total.textContent=a.length;pending.textContent=c.PENDING||0;approved.textContent=c.APPROVED||0;rejected.textContent=c.REJECTED||0;rows.innerHTML=a.map(x=>'<tr><td><b>'+esc(x.application_no)+'</b><br>'+new Date(x.submitted_at).toLocaleString()+'</td><td>'+esc(x.agency_name)+'<br>'+esc(x.owner_name)+'</td><td>'+esc(x.mobile)+'<br>'+esc(x.email)+'</td><td>PAN: '+esc(x.pan)+'<br>GST: '+esc(x.gst||"-")+'<br>IFSC: '+esc(x.ifsc)+'</td><td class="'+esc(x.status)+'"><b>'+esc(x.status)+'</b><br>'+esc(x.rejection_reason||"")+'</td><td><button class="green" onclick="statusApp(\''+esc(x.application_no)+'\',\'APPROVED\')">Approve</button> <button class="red" onclick="rejectApp(\''+esc(x.application_no)+'\')">Reject</button></td></tr>').join("")}catch(e){location.href="/admin-login.html"}}async function statusApp(no,status,reason){if(!confirm(status==="APPROVED"?"Approve this application?":"Continue?"))return;let r=await fetch("/api/admin-agent-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({applicationNo:no,status,rejectionReason:reason||null})}),d=await r.json();if(!r.ok)return alert(d.error);load()}function rejectApp(no){let reason=prompt("Rejection reason:");if(reason)statusApp(no,"REJECTED",reason)}logout.onclick=async()=>{await fetch("/api/admin-logout",{method:"POST"});location.href="/admin-login.html"};load();</script></body></html>
