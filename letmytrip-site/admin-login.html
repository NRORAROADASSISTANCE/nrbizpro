<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LETMYTRIP | Admin Login</title><style>:root{--navy:#071b3a;--gold:#c8943d;--ink:#12233d;--muted:#69778b;--line:#e7dfd0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#fbf8f2;color:var(--ink)}header{padding:18px 5%;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.brand{font-size:27px;font-weight:900;color:var(--navy)}.brand span{color:var(--gold)}a{color:#123d72;font-weight:800;text-decoration:none}main{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:25px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 20px 55px rgba(7,27,58,.12)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:900}.card h1{font-family:Georgia,serif;font-size:34px;margin:10px 0}.muted{color:var(--muted);line-height:1.6}label{display:block;font-size:13px;font-weight:800;margin:20px 0 7px}input{width:100%;padding:13px;border:1px solid #d9d0c1;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:14px;font-size:13px;font-weight:800;min-height:20px}</style></head><body><header><div class="brand">LET<span>MY</span>TRIP</div><a href="/">← Website</a></header><main><div class="card"><div class="eyebrow">SECURE ADMIN ACCESS</div><h1>Admin Login</h1><p class="muted">Sign in to manage agent applications and approvals.</p><form id="f"><label>Admin Password</label><input id="p" type="password" required autocomplete="current-password" placeholder="Enter admin password"><button id="b">Sign In →</button></form><div class="msg" id="m"></div></div></main><script>f.onsubmit=async e=>{e.preventDefault();b.disabled=true;b.textContent="Signing in...";m.textContent="";try{let r=await fetch("/api/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p.value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Login failed");location.href="/admin-dashboard.html"}catch(x){m.textContent=x.message}finally{b.disabled=false;b.textContent="Sign In →"}}</script></body></html>
