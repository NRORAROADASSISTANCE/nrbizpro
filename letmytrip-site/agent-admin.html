<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LETMYTRIP Agent Admin</title><style>body{font-family:Arial;margin:0;background:#f5f8fc;color:#123}header{background:#082b55;color:#fff;padding:18px 5%;font-size:24px;font-weight:800}main{max-width:1200px;margin:25px auto;padding:0 18px}.box{background:#fff;padding:20px;border:1px solid #dbe5f0;border-radius:15px;margin-bottom:18px}input,button{padding:10px;border-radius:8px;border:1px solid #ccd8e5}button{cursor:pointer;font-weight:700}.blue{background:#0b63ce;color:#fff}.red{background:#b42318;color:#fff}.green{background:#16834d;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5ebf2;text-align:left;font-size:13px}.PENDING{color:#a15c00}.APPROVED{color:#16834d}.REJECTED{color:#b42318}</style></head><body><header>LET<span style="color:#d6a84f">MY</span>TRIP — Agent Admin</header><main><div class="box"><h2>Admin Access</h2><input id="key" type="password" placeholder="Admin key"><button class="blue" onclick="load()">Open</button><span id="msg"></span></div><div id="dash" style="display:none"><div class="box"><b>Total:</b> <span id="total">0</span> &nbsp; <b>Pending:</b> <span id="pending">0</span> &nbsp; <b>Approved:</b> <span id="approved">0</span> &nbsp; <b>Rejected:</b> <span id="rejected">0</span></div><div class="box"><button onclick="load()">Refresh</button><div style="overflow:auto"><table><thead><tr><th>Application</th><th>Agency / Owner</th><th>Contact</th><th>KYC</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>let key="",apps=[];async function load(){key=document.getElementById("key").value.trim();try{let r=await fetch("/api/admin-agent-applications",{headers:{"x-letmytrip-admin-key":key}});let d=await r.json();if(!r.ok)throw Error(d.error);apps=d.applications||[];dash.style.display="block";msg.textContent="";render()}catch(e){msg.textContent=" "+e.message}}function x(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}function render(){let c={PENDING:0,APPROVED:0,REJECTED:0};apps.forEach(a=>c[a.status]++);total.textContent=apps.length;pending.textContent=c.PENDING;approved.textContent=c.APPROVED;rejected.textContent=c.REJECTED;rows.innerHTML=apps.map(a=>`<tr><td><b>${x(a.application_no)}</b><br>${new Date(a.submitted_at).toLocaleString()}</td><td>${x(a.agency_name)}<br>${x(a.owner_name)}</td><td>${x(a.mobile)}<br>${x(a.email)}</td><td>PAN: ${x(a.pan)}<br>GST: ${x(a.gst||"-")}<br>IFSC: ${x(a.ifsc)}</td><td class="${a.status}"><b>${a.status}</b><br>${x(a.rejection_reason||"")}</td><td><button class="green" onclick="setStatus('${x(a.application_no)}','APPROVED')">Approve</button> <button class="red" onclick="rejectApp('${x(a.application_no)}')">Reject</button></td></tr>`).join("")}async function setStatus(no,status,reason){if(!confirm(status==="APPROVED"?"Approve this application?":"Set pending?"))return;let r=await fetch("/api/admin-agent-status",{method:"POST",headers:{"Content-Type":"application/json","x-letmytrip-admin-key":key},body:JSON.stringify({applicationNo:no,status,rejectionReason:reason||null})});let d=await r.json();if(!r.ok)return alert(d.error);load()}function rejectApp(no){let reason=prompt("Rejection reason:");if(reason)setStatus(no,"REJECTED",reason)}</script></body></html>
