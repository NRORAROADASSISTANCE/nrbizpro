<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LETMYTRIP | Agent Dashboard</title><style>body{margin:0;font-family:Inter,Arial;background:#f5f8fc;color:#10284d}.top{padding:18px 5%;background:#fff;border-bottom:1px solid #e3e9f1;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;color:#062e86}.brand span{color:#f57b16}button{border:0;border-radius:10px;padding:11px 17px;font-weight:800;cursor:pointer;background:#062e86;color:#fff}.wrap{max-width:1000px;margin:35px auto;padding:0 18px}.hero,.box{background:#fff;border:1px solid #e3e9f1;border-radius:20px;padding:28px;box-shadow:0 12px 36px rgba(13,45,88,.08)}.hero{margin-bottom:20px}.muted{color:#66758c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.item{padding:16px;border-radius:13px;background:#f7faff}.label{font-size:12px;color:#66758c}.value{font-weight:800;margin-top:5px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand">LET<span>MY</span>TRIP</div><button onclick="logout()">Logout</button></div><div class="wrap"><div class="hero"><h1>Agent Dashboard</h1><p class="muted">Welcome to your LETMYTRIP travel partner account.</p></div><div class="box"><div class="grid" id="info"></div></div></div><script>const a=JSON.parse(localStorage.getItem("letmytrip_agent")||"null");if(!a)location.href="/agent-login.html";else{const x=[["Agency",a.agencyName],["Owner",a.ownerName],["Application No",a.applicationNo],["Mobile",a.mobile],["Email",a.email]];document.getElementById("info").innerHTML=x.map(i=>'<div class="item"><div class="label">'+i[0]+'</div><div class="value">'+String(i[1]||"") .replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))+'</div></div>').join("")}function logout(){localStorage.removeItem("letmytrip_agent");location.href="/agent-login.html"}</script></body></html>
