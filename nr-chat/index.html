<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NR CHAT — NR CONNECT</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1261ff">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img class="brand-icon" src="./icon.svg" alt="NR CHAT"><div><b>NR CHAT</b><span>by NR CONNECT</span></div></div>
    <div class="profile"><div class="avatar">R</div><div><b>Welcome</b><small id="accountType">Sign up to NR CHAT</small></div></div><button id="signupBtn" class="signup-btn">Create NR CHAT Account</button>
    <div class="search"><input id="search" placeholder="Search chats"></div>
    <div class="tabs"><button id="chatsTab" class="active" type="button">Chats</button><button id="contactsTab" type="button">Contacts</button></div>
    <div class="business-card"><b>Advertise with NR CHAT</b><small>Reach customers • Pay online • Get approved</small><button id="advertiseBtn">Create Advertisement</button></div>
    <div id="chatList" class="chat-list"></div>
    <div class="sidebar-footer"><span>NR CONNECT</span><span>v1.0</span></div>
  </aside>
  <main class="chat">
    <header class="chat-head">
      <button id="mobileBackBtn" class="mobile-back" type="button" aria-label="Back to chats">‹</button><div class="mobile-brand">NR CHAT</div>
      <div class="chat-person"><div class="avatar online">M</div><div><b id="person">NR CHAT</b><small id="status">Start a conversation</small></div></div>
      <div class="head-actions"><button title="Search">⌕</button><button id="chatMenuBtn" title="Chat privacy options">⋮</button><button id="callBtn" title="Calls">📞</button></div>
      <div id="chatMenu" class="chat-menu" hidden><button data-action="hide">🙈 Hide chat</button><button data-action="private">🔒 Private chat</button><button data-action="lock">🔐 Chat lock</button><button data-action="delete">🗑️ Delete chat</button></div>
    </header>
    <section id="messages" class="messages">
      <div class="welcome"><div class="welcome-icon">NR</div><h1>Welcome to NR CHAT</h1><p>Private, simple and fast messaging by NR CONNECT.</p></div>
    </section>
    <div class="chat-tools"><button type="button" id="disappearBtn">⏱️ Disappearing: Off</button><span id="privacyStatus">🔒 Protected</span></div><form id="composer" class="composer">
      <button type="button" id="attach" title="Attach">＋</button>
      <input id="message" autocomplete="off" placeholder="Type a message…">
      <button class="send" type="submit" title="Send">➤</button>
    </form>
  </main>
</div>
<script src="./app.js"></script>
</body>
</html>
