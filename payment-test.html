<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR BizPro ₹10 Payment Test</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#fff);color:#10233f}.wrap{max-width:520px;margin:50px auto;padding:20px}.card{background:#fff;border:1px solid #dce6f2;border-radius:18px;padding:26px;box-shadow:0 14px 35px rgba(25,64,120,.1)}h1{margin:0 0 6px;font-size:25px}p{color:#607089}.amount{font-size:34px;font-weight:900;margin:22px 0}.upi{background:#fff8df;border:1px solid #f0d98a;border-radius:12px;padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#1559d6;color:#fff}.secondary{background:#fff;color:#1559d6;border:1px solid #cbd7e8}input{width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border:1px solid #cbd7e8;border-radius:9px;font-size:15px}.note{margin-top:16px;padding:12px;border-radius:10px;background:#f5f8fc;color:#607089;font-size:13px}.success{margin-top:15px;padding:12px;background:#e9fff4;border:1px solid #a8e5c5;border-radius:10px;color:#11643c}.error{margin-top:15px;padding:12px;background:#fff0f0;border:1px solid #f1b2b2;border-radius:10px;color:#9b2222}</style></head><body><div class="wrap"><div class="card"><h1>NR BizPro — Payment Test</h1><p>This is a temporary test page. It will charge only ₹10 and will not activate a membership.</p><div class="amount">₹10.00</div><div id="upi" class="upi">Loading UPI details...</div><label style="display:block;margin-top:18px;font-weight:700">UTR / Transaction ID<input id="utr" maxlength="40" placeholder="Enter UTR after ₹10 payment"></label><button id="submit" class="primary" style="width:100%;margin-top:14px" disabled>Submit ₹10 Test Payment</button><div id="status"></div><div class="note">After successful testing, we will remove this test mode and restore the normal membership payment flow.</div></div></div><script>const $=id=>document.getElementById(id);let upi='';async function load(){try{const r=await fetch('/api/direct-payment?action=config',{credentials:'same-origin'});const d=await r.json();if(!r.ok||!d.configured)throw Error(d.error||'UPI is not configured');upi=d.upiId;const intent=`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(d.upiName||'NR BizPro')}&am=10&cu=INR&tn=${encodeURIComponent('NR BizPro ₹10 Payment Test')}`;$('upi').innerHTML=`<b>Pay ₹10 via UPI</b><br><span>UPI ID: <strong>${esc(upi)}</strong></span><div class="actions"><button id="copy" class="secondary">Copy UPI ID</button><a class="secondary" href="${intent}">Open UPI App</a></div>`;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(upi);$('copy').textContent='UPI ID Copied ✓'}catch{alert('Copy this UPI ID manually: '+upi)}};$('submit').disabled=false}catch(e){$('upi').innerHTML='<b>Unable to load UPI details.</b><br>'+esc(e.message)}}function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}$('submit').onclick=async()=>{const utr=$('utr').value.trim().replace(/\s+/g,'');if(!/^[A-Za-z0-9-]{8,40}$/.test(utr)){alert('Enter a valid UTR (8-40 characters).');return}$('submit').disabled=true;$('submit').textContent='Submitting...';try{const r=await fetch('/api/direct-payment',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',plan:'test10',utr})});const d=await r.json();if(!r.ok)throw Error(d.error||'Payment submission failed');$('status').innerHTML='<div class="success">₹10 test payment submitted successfully. Payment ID: '+esc(d.paymentId)+'</div>';$('submit').textContent='Submitted ✓'}catch(e){$('status').innerHTML='<div class="error">'+esc(e.message)+'</div>';$('submit').disabled=false;$('submit').textContent='Submit ₹10 Test Payment'}};load();</script></body></html>
