<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paytm Payment — NR BizPro</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="max-width:620px;margin:12vh auto;padding:24px;background:#fff;border-radius:16px;text-align:center"><h1>Checking Paytm payment…</h1><p id="status">Please wait while NR BizPro confirms your payment securely.</p><a href="/" id="back" hidden>Return to NR BizPro</a></main>
<script>
(async function(){
 const status=document.getElementById('status'),back=document.getElementById('back');
 try {
   const params=new URLSearchParams(location.search);
   const orderId=params.get('ORDERID')||params.get('orderId');
   if(!orderId) throw new Error('Order reference was not returned by Paytm. Please open NR BizPro and check payment status.');
   const r=await fetch('/api/verify-payment',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({gateway:'paytm',orderId})});
   const d=await r.json();
   if(!r.ok||!d.verified) throw new Error(d.error||'Payment is not confirmed yet.');
   status.textContent='Payment verified. Your membership is active. You can return to NR BizPro.';
 } catch(e) { status.textContent=e.message||'Payment status could not be confirmed. Please do not pay again until you check your account.'; }
 back.hidden=false;
})();
</script></body></html>
