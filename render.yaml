services:
  - type: web
    name: letmytrip
    runtime: node
    rootDir: letmytrip-site
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LETMYTRIP_ADMIN_KEY
        sync: false
