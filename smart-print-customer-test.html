<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR BizPro — Smart Print Customer Test</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f5f7fb}.bar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;background:#111827;color:#fff}.bar strong{font-size:18px}.bar span{font-size:13px;opacity:.9}.badge{background:#fff;color:#111827;padding:8px 12px;border-radius:999px;font-weight:700}.frame{height:calc(100% - 62px);border:0;width:100%;display:block}</style></head><body><div class="bar"><div><strong>NR BizPro Smart Print — Customer Test</strong><br><span>5 successful document/ID test pages • Passport Photo = Premium only</span></div><div class="badge" id="count">5 test pages</div></div><iframe class="frame" id="app" src="smart-print.html?customerTest=1"></iframe><script>(function(){const LIMIT=5,KEY='nr-bizpro-smart-print-customer-test-v1',frame=document.getElementById('app');function left(w){try{const all=JSON.parse(w.localStorage.getItem(KEY)||'{}'),d=all.test||{trialCopies:0};return Math.max(0,LIMIT-(d.trialCopies||0))}catch{return LIMIT}}function install(){const w=frame.contentWindow;if(!w)return;const update=()=>{document.getElementById('count').textContent=left(w)+' test pages'};update();setInterval(update,500)}if(frame.contentWindow.document.readyState==='complete')install();else frame.addEventListener('load',install)})();</script></body></html>
