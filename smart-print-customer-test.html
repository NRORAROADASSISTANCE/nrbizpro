<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NR BizPro — Smart Print Customer Test</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f5f7fb}.bar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;background:#111827;color:#fff}.bar strong{font-size:18px}.bar span{font-size:13px;opacity:.9}.badge{background:#fff;color:#111827;padding:8px 12px;border-radius:999px;font-weight:700}.frame{height:calc(100% - 62px);border:0;width:100%;display:block}</style></head><body><div class="bar"><div><strong>NR BizPro Smart Print — Customer Test</strong><br><span>5 successful document/ID test pages • Passport Photo = Premium only</span></div><div class="badge" id="count">5 test pages</div></div><iframe class="frame" id="app" src="smart-print.html"></iframe><script>(function(){const LIMIT=5,KEY='nr-bizpro-smart-print-v1',USERS='nr-bizpro-users-v1',SESSION='nr-bizpro-session-v1',frame=document.getElementById('app');function account(w){try{const id=w.localStorage.getItem(SESSION),u=JSON.parse(w.localStorage.getItem(USERS)||'[]');return u.find(x=>x.id===id)||null}catch{return null}}function data(w){try{const a=account(w),all=JSON.parse(w.localStorage.getItem(KEY)||'{}');return a?all[a.id]||{trialCopies:0}:null}catch{return null}}function left(w){const d=data(w);return Math.max(0,LIMIT-(d?.trialCopies||0))}function install(){const w=frame.contentWindow;if(!w||!w.canPrint)return;w.canPrint=function(){if(!account(w))return false;const licensed=typeof w.isLicensed==='function'&&w.isLicensed();const activeType=w.document.querySelector('.types button.active')?.dataset.type||'document';if(!licensed){if(activeType==='passport'){w.alert('Passport-size photos are Premium only. Please activate Smart Print Premium.');return false}const copies=Math.max(1,+(w.document.getElementById('copies')?.value)||1);if(copies>left(w)){w.alert('Customer test limit reached. Only '+left(w)+' test pages remain.');return false}}return true};const old=w.updateLicense;w.updateLicense=function(){if(typeof old==='function')old();const t=w.document.getElementById('licenseText');const s=w.document.getElementById('licenseSub');const n=w.document.getElementById('trialNote');if(t)t.textContent=(typeof w.isLicensed==='function'&&w.isLicensed())?'Premium':'Customer Test';if(s)s.textContent=(typeof w.isLicensed==='function'&&w.isLicensed())?'5-Year Unlimited':left(w)+' test pages left';if(n)n.textContent=(typeof w.isLicensed==='function'&&w.isLicensed())?'Premium: Passport Photos + Unlimited Printing':'Customer Test: 5 successful document/ID test pages. Passport photos are Premium only.'};w.updateLicense();document.getElementById('count').textContent=left(w)+' test pages';setInterval(()=>document.getElementById('count').textContent=left(w)+' test pages',500)}if(frame.contentWindow.document.readyState==='complete')install();else frame.addEventListener('load',install)})();</script></body></html>
